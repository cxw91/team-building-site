<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>团建管理</title>
  <meta name="theme-color" content="#0A0D1A" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/favicon.ico" />
  <script>
    /* 主题引导：在样式表加载前先把 data-theme 定下来，避免刷新时先闪一下浅色再跳深色。
       取值顺序：上次选择（localStorage）→ 系统偏好 → 浅色。 */
    (function () {
      var t = null;
      try { t = localStorage.getItem("tb_theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
    /* 设置项引导：同样要在样式表加载前落到 html 上，否则刷新时会先闪一下默认的
       品牌紫 / 248px 宽边，再「啪」地跳成用户选过的强调色与窄边。
         data-accent     强调色（默认 violet，即改版前的品牌紫）
         side-auto       侧边栏动画已使能，由「设置」弹窗控制，默认关闭
         side-rail       当前窄边；动画使能时刷新恒从窄边起步，手动模式才读上次存的宽窄
         side-icon-right 底部按钮显示「竖线靠右」那枚图标（= 自动悬停态 / 手动窄边），
                         由底部脚本按当前模式算；提前预置避免刷新时图标闪一下 */
    (function () {
      var allowed = ["violet", "ocean", "teal", "forest", "amber", "rose"];
      var ac = null, anim = null, oldAuto = null, rail = null;
      try {
        ac = localStorage.getItem("tb_accent");
        anim = localStorage.getItem("tb_sidebar_anim");
        oldAuto = localStorage.getItem("tb_sidebar_auto");
        rail = localStorage.getItem("tb_sidebar_rail");
      } catch (e) {}
      if (allowed.indexOf(ac) < 0) ac = "violet";
      document.documentElement.setAttribute("data-accent", ac);
      /* 老版本用 tb_sidebar_auto 存「自动悬停」；没写过新 key 时沿用一次，避免升级后丢失偏好 */
      var animOn = anim === null ? oldAuto === "1" : anim === "1";
      /* 动画使能时刷新恒从「自动悬停窄边」起步：竖线靠右。
         手动模式则按存下来的宽窄决定：窄边竖线右、宽边竖线左。 */
      if (animOn) document.documentElement.classList.add("side-auto", "side-rail", "side-icon-right");
      else if (rail === "1") document.documentElement.classList.add("side-rail", "side-icon-right");
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 背景层：极光色团 + 细网格 + 顶部聚光。纯装饰（aria-hidden + pointer-events:none），
       深色主题下由 CSS 换成更低的明度。 -->
  <div class="bg-aurora" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="bg-grid"></span>
    <span class="bg-vignette"></span>
    <canvas id="bg-particles" aria-hidden="true"></canvas>
  </div>

  <!-- 图标集：线条（描边）风格，24×24、描边 1.7、圆角端点，颜色跟随 currentColor。
       只在侧边栏与按钮里用 <use> 引用；页签图标由 CSS mask 提供（见 style.css）。 -->
  <svg aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4.3" />
        <path d="M12 5.6V2.8M12 18.4v2.8M5.6 12H2.8M18.4 12h2.8M7.475 7.475L5.495 5.495M16.525 7.475l1.98-1.98M16.525 16.525l1.98 1.98M7.475 16.525l-1.98 1.98" />
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.33A9 9 0 1 1 11.67 3.01A7 7 0 0 0 21 12.33Z" />
      </symbol>
      <symbol id="icon-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7.5" height="7.5" rx="2" />
        <rect x="13.5" y="3" width="7.5" height="7.5" rx="2" />
        <rect x="3" y="13.5" width="7.5" height="7.5" rx="2" />
        <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" />
      </symbol>
      <symbol id="icon-switch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h13l-3-3M20 16H7l3 3" />
      </symbol>
      <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 10.6 12 4l8 6.6V19a1.4 1.4 0 0 1-1.4 1.4H5.4A1.4 1.4 0 0 1 4 19z" />
        <path d="M9.6 20.4v-6h4.8v6" />
      </symbol>
      <symbol id="icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 4h3.4A1.6 1.6 0 0 1 20 5.6v12.8a1.6 1.6 0 0 1-1.6 1.6H15" />
        <path d="M10 8l-4 4 4 4M6 12h9" />
      </symbol>
      <symbol id="icon-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="4.2" />
        <path d="M11 11l8.5 8.5M16.5 16.5 19 14" />
      </symbol>
      <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.4" y="10.4" width="15.2" height="10.2" rx="2.6" />
        <path d="M8.2 10.4V7.8a3.8 3.8 0 0 1 7.6 0v2.6" />
      </symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M11 6l-6 6 6 6" />
      </symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9.5l6 6 6-6" />
      </symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </symbol>
      <!-- 汉堡菜单里的「设置」入口 -->
      <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.56V21a2 2 0 0 1-4 0v-.04A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 0 1 0-4h.04A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 0 1 4 0v.04A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 0 1 0 4h-.04A1.7 1.7 0 0 0 19.4 15Z" />
      </symbol>
      <!-- 底部「自动收起」开关的两态图标：圆角矩形描边 + 上下内缩的一根短竖线。
           未使能 = 竖线靠左（配浅色圆角按钮底、亮描边）；
           使能   = 竖线靠右（无按钮底、灰描边）。 -->
      <symbol id="icon-panel-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.4" y="4" width="17.2" height="16" rx="3" />
        <path d="M7.8 7.6v8.8" />
      </symbol>
      <symbol id="icon-panel-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.4" y="4" width="17.2" height="16" rx="3" />
        <path d="M16 7.6v8.8" />
      </symbol>
      <!-- 顶栏「刷新」：手动要一次最新数据，不依赖 30 秒版本探针的节奏 -->
      <!-- 箭头方向改为逆时针：对整组路径做水平镜像即可，比手写镜像 path 稳妥
           （arc 的 sweep-flag 与相对坐标容易算错）。只翻静态图标，点击时的转圈
           仍由 style.css 的 spin 控制，方向不变。 -->
      <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(24, 0) scale(-1, 1)">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M16 16h5v5" />
        </g>
      </symbol>
      <!-- 品牌图案：只定义一次，四处 .brand-mark 用 <use> 引用。
           fill 用 currentColor，颜色取 .brand-mark 的白色，方块底色仍是原来的紫色渐变。 -->
      <symbol id="icon-brand" viewBox="0 0 1024 1024">
        <path fill="currentColor" d="M472.1 65.7l44.9 36.5c-13.8 13.3-22.9 31.4-24.3 51.6-1.3 18.1-2.7 36.4-4.3 52.8-0.5 0.2-1.1 0.3-1.5 0.5-18 5.3-48.2 14.1-67.3 42.9l-0.3 0.5-0.3 0.5c-16.4 25.6-17.6 56.7-3.1 83.2 16.1 29.4 49.9 49.2 90.7 54-1 1.8-2 3.7-3 5.5-0.4 0.8-0.9 1.6-1.3 2.4-5.7-1.7-11.9-2.7-18.8-2.7-4 0-7.9 0.4-11.8 1.1-4-0.9-9.2-2.2-13.2-3.1-15.4-3.8-31.4-7.8-47.4-7.8-2.6 0-5.2 0.1-7.7 0.3-24.5 2-45.6 15.2-58.5 36.5-17.6 2-33.9 11.4-44.5 25.8-5.4 7.4-16.8 26.9-10.6 53.1 0.3 4.5 0.8 9.5 1.4 15.5 1.1 11.5 2.5 26.3 3.6 44-10.4-5-22-8.8-33.6-9-0.9 0-1.6-0.1-2.1-0.1-1.6-2.7-5.5-10.7-8.3-29.6-3.3-22.4-3.5-49.9-3.5-76.2 0-18.7-5.8-53.7-44.4-77.3-16.9-10.3-36.3-15.8-56.3-15.8-19.4 0-38.3 5.1-55.2 14.7l-2.5-1c3.1-9 6.6-17.9 10.3-26.7 22.6-53.3 54.9-101.3 96-142.4s89.1-73.5 142.4-96c43-18.4 88.1-29.6 134.5-33.7m462.5 343.1l15.7 9.8c6.5 30.5 9.7 61.7 9.7 93.4 0 22.1-1.6 43.9-4.7 65.5l-54.5 48.9c-1.6-2.5-3.3-5-5-7.4-15.1-20.9-30.1-38.4-44.6-51.9-6.9-6.4-11.9-12.6-15-18.5-3.2-6.1-3.5-10.3-3.3-13.3 0.4-7.5 4.3-17 11.4-27.6 11.8-17.5 31.2-36.7 57.7-57.1l37.6-28.8-5-13M449.9 685.2c4.2 2.7 8.8 5.3 13.7 7.6 7.9 3.7 21.7 16.7 31.7 26.1 14.6 13.7 30.4 28.5 49.2 38.2 9.6 22.4 24.3 34.4 38.5 40.6-13.2 17.4-22.3 36.6-29.6 57.6l0.1-7.7-27.4-19.6c-0.2-0.1-20-14.4-41.2-33.7-29.7-27-38.8-42.3-41.2-47.1 0.3-15 2.1-27 3.6-36.8 1.3-7.2 2.6-15.8 2.6-25.2M512 0C229.2 0 0 229.2 0 512s229.2 512 512 512 512-229.2 512-512S794.8 0 512 0z m14.2 325.2c-38.2 0-65.8-20.3-53.3-39.8 15.9-23.9 72.8-10.6 77.9-58.6 2.3-22.2 4.3-47.2 5.8-68.5 0.5-7.7 6.7-13.7 14.4-14.2 37.2-2.7 41-47 6.2-75.3 37.5 5.4 74.1 15.6 109.2 30.5 53.3 22.6 101.3 54.9 142.4 96 37.4 37.4 67.4 80.3 89.6 127.8-5.7-3.6-11.6-5.2-17.4-5.2-28.2 0-54.2 38.4-38 82-133 102-98.9 173.4-55.5 214 12.8 12 25.4 27.4 36.4 42.7 10.6 14.6 17.2 31.5 21 49.2 1.4 6.4 6.4 9.6 13.7 9.6 11 0 27-7.3 43.1-21.7-22.4 50.5-53.6 95.9-92.9 135.2-41.2 41.2-89.1 73.5-142.4 96-24.4 10.3-49.4 18.4-75 24.1-1.5-0.3-3.2-0.4-5-0.4-3.5 0-7.5 0.5-12 1.7 15.5-65.5 22.9       </symbol>
    </defs>
  </svg>

  <!-- 登录 -->
  <section id="loginView" class="view center">
    <div class="auth">
      <div class="auth-halo" aria-hidden="true"></div>
      <div class="panel">
        <div class="brand-mark" aria-hidden="true"><svg class="brand-icon" aria-hidden="true" focusable="false"><use href="#icon-brand"></use></svg></div>
        <h1 class="logo">团建管理</h1>
        <p class="sub">请输入团队口令进入</p>
        <input id="passcode" type="password" name="team-passcode" placeholder="口令" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore />
        <button id="loginBtn" class="primary block">进入</button>
        <p id="loginMsg" class="msg"></p>
        <div class="pc-open-row">
          <button id="pcManageToggle" class="link" type="button" aria-haspopup="dialog">
            <svg class="ico" aria-hidden="true"><use href="#icon-key"></use></svg>管理口令
          </button>
        </div>
      </div>
    </div>
    <!-- 自动恢复会话（本地已有 token 且没有上次项目时才出现）：期间不显示可交互的口令框，
         避免网络慢时用户盯着登录页、误以为没登录成功。上次停在项目里的刷新已改为直接
         进项目内铺骨架屏（见 app.js 的 init()），不再走这张卡片。由 setSessionRestoring() 开关。 -->
    <div id="sessionLoading" class="session-loading" hidden role="status" aria-live="polite">
      <div class="panel session-panel">
        <div class="session-spinner" aria-hidden="true"></div>
        <h1 class="logo">正在恢复会话</h1>
        <p class="sub">正在打开上次的项目，请稍候…</p>
      </div>
    </div>
  </section>

  <!-- 项目中心：新建 / 历史项目 -->
  <section id="homeView" class="view hidden shell">
    <aside class="sidebar">
      <!-- 桌面展开态沿用改版前的「logo + 两行标题」；收起态只留 logo 并居中。
           ≤900px 的固定顶栏也仍用 .side-titles，所以节点一直保留在 DOM 里。 -->
      <div class="side-top">
        <div class="brand-mark sm" aria-hidden="true"><svg class="brand-icon" aria-hidden="true" focusable="false"><use href="#icon-brand"></use></svg></div>
        <div class="side-titles">
          <span class="brand-name">团建管理</span>
          <span class="brand-sub">项目中心</span>
        </div>
      </div>
      <nav class="side-nav" aria-label="主导航">
        <span class="nav-item active" aria-current="page" aria-label="我的项目" title="我的项目">
          <svg class="ico" aria-hidden="true"><use href="#icon-grid"></use></svg>
          <span class="nav-label">我的项目</span>
          <span class="nav-count" id="projCount"></span>
        </span>
      </nav>
      <div class="side-foot">
        <button class="side-toggle" type="button" aria-pressed="false" title="切换侧边栏宽窄" aria-label="切换侧边栏宽窄">
          <svg class="ico side-toggle-ico--off" aria-hidden="true"><use href="#icon-panel-left"></use></svg>
          <svg class="ico side-toggle-ico--on" aria-hidden="true"><use href="#icon-panel-right"></use></svg>
        </button>
      </div>
    </aside>
    <div class="main">
      <!-- 项目中心也用和项目内完全一样的顶栏：右上角按钮的横向位置一致，
           切主题、进项目都不会看到按钮「跳一下」。 -->
      <header class="topbar">
        <span class="topbar-dot" aria-hidden="true"></span>
        <div class="topbar-title">项目中心</div>
        <div class="topbar-actions">
          <button id="logoutBtn2" class="top-btn">
            <svg class="ico" aria-hidden="true"><use href="#icon-logout"></use></svg><span class="top-btn-text">退出登录</span>
          </button>
          <button class="theme-btn" data-action="toggle-theme" type="button" title="切换主题" aria-label="切换主题">
            <svg class="theme-icon theme-icon--sun" aria-hidden="true" focusable="false"><use href="#icon-sun"></use></svg>
            <svg class="theme-icon theme-icon--moon" aria-hidden="true" focusable="false"><use href="#icon-moon"></use></svg>
          </button>
        </div>
      </header>
      <main class="content home-content">
        <div class="page-head">
          <div class="page-head-main">
            <h1 class="page-title">我的团建项目</h1>
            <p class="page-sub">管理项目、家庭、采购与结算</p>
          </div>
        </div>
        <div id="projList" class="proj-grid"></div>
      </main>
    </div>
  </section>

  <!-- 新建团建项目弹窗：从「我的团建项目」里的「+」卡片打开 -->
  <div id="newProjModal" class="modal hidden">
    <div class="modal-card modal-wide">
      <h2 class="modal-title">新建团建项目</h2>
      <div class="form-row">

  <script src="/app.js"></script>
  <!-- 纯视觉增强：桌面把指针位置写进卡片 CSS 变量，驱动「跟随光斑」；
       手机（真触屏）上只让「当前点击的那张卡」激活流光边 / 外辉光 / 旋转，
       点击位置周围那圈径向光斑由 CSS 关掉，不写坐标、不加按下态。
       与业务逻辑完全隔离，出错也不影响功能。 -->
  <script>
    (function () {
      var TOUCH = !!(window.matchMedia &&
        window.matchMedia("(hover: none) and (pointer: coarse)").matches);
      var CARDS = ".section,.card,.proj-card,.proj-add,.panel,.modal-card";
      var SEL = CARDS + ",.pick";

      /* ---------- 手机：点哪张卡，哪张卡亮；点别处全部熄灭 ---------- */
      if (TOUCH) {
        var active = null, sig = null;

        // 标题 / 标签作为跨重建的签名：卡片会被 #content.innerHTML 整体换掉，
        // 只记元素引用会丢，只记索引又可能在切页后把光挂到另一张卡上。
        function textOf(el) {
          var t = el.querySelector(".section-head .title, .title, .lbl, h1, h2, h3");
          return ((t ? t.textContent : el.textContent) || "").replace(/\s+/g, " ").trim().slice(0, 40);
        }
        function signature(el) {
          var all = document.querySelectorAll(CARDS), i = 0;
          for (; i < all.length; i++) if (all[i] === el) break;
          return { i: i < all.length ? i : -1, t: textOf(el) };
        }
        function findActive() {
          if (!sig) return null;
          var all = document.querySelectorAll(CARDS), i;
          var byIndex = all[sig.i];
          if (byIndex && (!sig.t || textOf(byIndex) === sig.t)) return byIndex;
          for (i = 0; i < all.length; i++) {
            if (sig.t && textOf(all[i]) === sig.t) return all[i];
          }
          return null;
        }
        function setActive(el) {
          if (active === el) return;
          if (active) active.classList.remove("fx-active");
          active = el;
          sig = el ? signature(el) : null;
          if (active) active.classList.add("fx-active");
        }

        // 用 pointerup 而不是 pointerdown：滚动页面时按下不该点亮卡片；
        // 移动超过 10px 视为滑动，直接放弃这次激活。
        var down = null;
        document.addEventListener("pointerdown", function (e) {
          if (e.pointerType === "mouse") return;
          down = { x: e.clientX, y: e.clientY, t: e.target };
        }, { passive: true });
        document.addEventListener("pointermove", function (e) {
          if (!down || e.pointerType === "mouse") return;
          if (Math.abs(e.clientX - down.x) > 10 || Math.abs(e.clientY - down.y) > 10) down.moved = true;
        }, { passive: true });
        document.addEventListener("pointerup", function (e) {
          if (e.pointerType === "mouse" || !down) return;
          var d = down; down = null;
          if (d.moved) return;
          var el = d.t && d.t.closest ? d.t.closest(CARDS) : null;
          // 只读卡不参与光效；设置弹窗也不需要鼠标聚光 / 点亮态
          if (el && (el.classList.contains("readonly") || el.classList.contains("settings-card"))) el = null;
          setActive(el);                       // 点在卡片外 = 取消所有激活
        }, { passive: true });
        document.addEventListener("pointercancel", function () { down = null; }, { passive: true });

        // #content 会被整块重建（切页、提交后刷新）：同一张卡补回激活态，
        // 签名对不上（换页 / 卡片已不存在）就自然熄灭。
        if (window.MutationObserver) {
          var touchRoot = document.getElementById("content");
          if (touchRoot) {
            new MutationObserver(function (muts) {
              if (!sig || (active && active.isConnected)) return;
              var added = false;
              for (var i = 0; i < muts.length; i++) {
                if (muts[i].addedNodes && muts[i].addedNodes.length) { added = true; break; }
              }
              if (!added) return;
              var next = findActive();
              active = null;                  // 旧节点已脱离文档，跳过 setActive 的相等判断
              setActive(next);
            }).observe(touchRoot, { childList: true, subtree: true });
          }
        }
        return;
      }

      /* ---------- 桌面：原生 :hover + 跟手光斑 ---------- */
      var raf = 0, last = null;
      // 记录的是坐标而不是事件对象：内容区会被整块重建（切页签、后台刷新），
      // 重建后旧的事件目标已经脱离文档，必须用 elementFromPoint 重新取当前指针下的元素。
      function apply() {
        raf = 0;
        if (!last || !document.elementFromPoint) return;
        var el = document.elementFromPoint(last.x, last.y);
        if (!el || !el.closest) return;
        el = el.closest(SEL);
        if (!el || el.classList.contains("settings-card")) return; // 设置弹窗不写指针光斑坐标
        var r = el.getBoundingClientRect();
        el.style.setProperty("--mx", Math.round(last.x - r.left) + "px");
        el.style.setProperty("--my", Math.round(last.y - r.top) + "px");
      }
      function schedule() {
        if (!raf) raf = requestAnimationFrame(function () { apply(); });
      }
      document.addEventListener("pointermove", function (e) {
        last = { x: e.clientX, y: e.clientY };
        schedule();
      }, { passive: true });

      // 重建后补一次：新卡片还没拿到指针坐标，光斑会突然消失（看上去也是一次闪）。
      // 在 MutationObserver 里同步补，而不是等下一帧 rAF —— 微任务早于本帧的样式/绘制，
      // 所以重建的那一帧就已经带上光斑；丢给 rAF 会白白空出一帧。
      if (window.MutationObserver) {
        var root = document.getElementById("content");
        if (root) {
          new MutationObserver(function (muts) {
            for (var i = 0; i < muts.length; i++) {
              if (muts[i].addedNodes && muts[i].addedNodes.length) { apply(); return; }
            }
          }).observe(root, { childList: true, subtree: true });
        }
      }
    })();

    /* 顶栏标题跟随当前页签。页签栏由 app.js 整体重建，所以用观察器同步，
       只读 .tab.active 的文本节点（跳过新日志徽标等元素），不参与业务逻辑。 */
    (function () {
      var tabs = document.getElementById("tabs");
      var title = document.getElementById("pageTitle");
      if (!tabs || !title || !window.MutationObserver) return;
      function sync() {
        var a = tabs.querySelector(".tab.active");
        if (!a) return;
        /* 页签文字现在包在 .tab-label 里（收起态要整块隐藏），直接读文本节点会读到空串；
           保留原来的遍历作为旧结构兜底。 */
        var lab = a.querySelector(".tab-label");
        var t = lab ? (lab.textContent || "").trim() : "";
        if (!t) {
          for (var i = 0; i < a.childNodes.length; i++) {
            if (a.childNodes[i].nodeType === 3) t += a.childNodes[i].nodeValue;
          }
          t = (t || "").trim();
        }
        if (t && title.textContent !== t) title.textContent = t;
      }
      new MutationObserver(sync).observe(tabs, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ["class"],
      });
      sync();
    })();

    /* 侧栏宽窄 + 自动悬停动画。
       html 上的 class：
         side-auto       动画已使能（「设置」弹窗控制，默认关闭，存 tb_sidebar_anim）
         side-rail       当前窄边（手动模式存 tb_sidebar_rail）
         side-icon-right 底部按钮显示「竖线靠右」那枚图标，由 syncButtons() 算出
       宽度补间全部交给 CSS。底部按钮的图标表达的是「模式」，不是实时宽度：
         动画关闭：点一下只手动切宽 / 窄，鼠标移动完全不触发；图标跟宽窄走
                   （窄边竖线右、宽边竖线左）。
         动画开启：默认「自动悬停」= 竖线右（窄边，鼠标移入缓动展开、移出缓动收回）；
                   点一下切成「固定展开」= 竖线左（宽边，不需要鼠标动画，移出也不收回）；
                   再点一下回到「自动悬停」= 竖线右，并恢复鼠标动画。
                   ★ 动画使能时图标只跟模式走，hover 引起的展开 / 收回（含补间过程）
                     都不改图标 —— 这就是「动画期间图标不变」。
       pinned 只在动画开启时有意义，是内存态、不写盘：刷新一律回到自动悬停窄边起步。 */
    (function () {
      var root = document.documentElement;
      var ANIM_KEY = "tb_sidebar_anim";
      var RAIL_KEY = "tb_sidebar_rail";
      var canHover = !!(window.matchMedia &&
        window.matchMedia("(hover: hover) and (pointer: fine)").matches);
      var auto = root.classList.contains("side-auto");
      var pinned = false; // 动画开启时「固定展开、不随鼠标收回」
      var leaveTimer = 0;

      /* 不另存一个「鼠标是否在侧栏内」的标记：视图切换时旧侧栏被 display:none，
         pointerleave 可能不触发，标记就会烂在那里。直接问浏览器最准。 */
      function pointerInside() {
        var sides = document.querySelectorAll(".shell > .sidebar");
        for (var i = 0; i < sides.length; i++) {
          if (sides[i].offsetParent !== null && sides[i].matches(":hover")) return true;
        }
        return false;
      }

      /* 高亮滑块的宽度现在由 CSS 的 calc(var(--side-w) - 21px) 驱动，和侧栏宽度
         走同一条缓动曲线。以前靠 rAF 每帧读 offsetWidth + 强制重排去追，
         那正是展开/收回发顿的主要来源；这里只在动画结束后对一次坐标。 */
      function setRail(on, persist) {
        var next = !!on;
        if (root.classList.contains("side-rail") !== next) {
          root.classList.toggle("side-rail", next);
        }
        /* 只持久化手动按钮切出来的宽窄；动画模式下 hover 每次进出都写盘的话，
           刷新时就会停在「鼠标恰好悬在侧栏里」的展开态，而不是从窄边起步。 */
        if (persist && !auto) {
          try { localStorage.setItem(RAIL_KEY, next ? "1" : "0"); } catch (e) {}
        }
        syncButtons();
      }
      function syncButtons() {
        var narrow = root.classList.contains("side-rail");
        /* 图标语义：动画关闭时跟实时宽窄；动画开启时只跟「自动 / 固定展开」这个模式，
           与 side-rail 脱钩，所以 hover 展开 / 收回的整段动画里图标都不动。 */
        var iconRight = auto ? !pinned : narrow;
        root.classList.toggle("side-icon-right", iconRight);
        var label;
        if (!auto) label = narrow ? "展开侧边栏" : "收起侧边栏";
        else if (pinned) label = "使能鼠标侧边栏动画";
        else label = "固定展开侧边栏";
        var all = document.querySelectorAll(".side-toggle");
        for (var i = 0; i < all.length; i++) {
          all[i].setAttribute("aria-pressed", iconRight ? "true" : "false");
          all[i].setAttribute("aria-label", label);
          all[i].title = label;
        }
      }
      /* 供「设置」弹窗里的开关调用。切换动画时一律清掉「固定展开」，
         让两种模式都从一个明确的初态开始。 */
      function setAuto(on) {
        clearTimeout(leaveTimer);
        auto = !!on;
        pinned = false;
        root.classList.toggle("side-auto", auto);
        try { localStorage.setItem(ANIM_KEY, auto ? "1" : "0"); } catch (e) {}
        /* 开启：指针在侧栏内就先保持展开，等移出再收；否则立刻收成窄边。
           关闭：保留眼前这一刻的宽窄并写盘，刷新后原样恢复。 */
        if (auto) setRail(!pointerInside(), false);
        else setRail(root.classList.contains("side-rail"), true);
        syncButtons();
      }
      window.setSideAnim = setAuto;

      document.addEventListener("click", function (e) {
        var b = e.target && e.target.closest ? e.target.closest(".side-toggle") : null;
        if (!b) return;
        clearTimeout(leaveTimer);
        if (!auto) {
          /* 动画关闭：纯手动宽窄，鼠标移动不参与，状态写盘 */
          setRail(!root.classList.contains("side-rail"), true);
          return;
        }
        /* 动画开启：按钮在「自动悬停（竖线右）」与「固定展开（竖线左）」之间切换。
           指针移进按钮时 pointerenter 会先把侧栏展开，所以这里不能只看当前 rail ——
           按「是否处于固定展开」判定，才和用户看到的图标语义一致。
           图标在这一次点击里换到位，随后 hover 展开 / 收回的整段动画都不再动它。 */
        if (pinned) {
          pinned = false;
          setRail(true, false);   // 竖线右：收回窄边，恢复鼠标移入展开 / 移出收回
        } else {
          pinned = true;
          setRail(false, false);  // 竖线左：固定展开，鼠标移出也不收回
        }
        syncButtons();
      });

      if (canHover) {
        var sides = document.querySelectorAll(".shell > .sidebar");
        for (var j = 0; j < sides.length; j++) {
          sides[j].addEventListener("pointerenter", function (e) {
            if (e.pointerType !== "mouse" || !auto) return;
            clearTimeout(leaveTimer);
            setRail(false, false);
          });
          sides[j].addEventListener("pointerleave", function (e) {
            /* 固定展开（pinned）时鼠标移出不收回：这就是「不需要鼠标动画」 */
            if (e.pointerType !== "mouse" || !auto || pinned) return;
            clearTimeout(leaveTimer);
            /* 鼠标移出后稍等一下再收：侧栏是「被动」缩回，立刻收会让人觉得猝不及防；
               放宽到 180ms 还能吞掉指针擦着边缘进出的短暂停留，避免反复反向打断。 */
            leaveTimer = setTimeout(function () { setRail(true, false); }, 180);
          });
          sides[j].addEventListener("transitionend", function (e) {
            if (e.propertyName === "width" && typeof window.syncNavGlider === "function") {
              window.syncNavGlider(false);
            }
          });
        }
      }
      syncButtons();
    })();
  </script>
</body>
</html>
